<script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });
        
        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                // Save the image data to localStorage so editor.html can read it
                localStorage.setItem('eraserpro_uploaded_image', event.target.result);
                localStorage.setItem('eraserpro_uploaded_filename', file.name);
                window.location.href = 'editor.html';
            };
            reader.readAsDataURL(file);
        }
        
        // Handle sample images click
        document.querySelectorAll('.sample-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const img = btn.querySelector('img');
                const url = img.getAttribute('data-full-url');
                
                // Fetch the sample image and convert to base64 to behave exactly like an upload
                fetch(url)
                    .then(response => response.blob())
                    .then(blob => {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            localStorage.setItem('eraserpro_uploaded_image', event.target.result);
                            localStorage.setItem('eraserpro_uploaded_filename', 'sample_image.jpg');
                            window.location.href = 'editor.html';
                        };
                        reader.readAsDataURL(blob);
                    });
            });
        });
    </script>
